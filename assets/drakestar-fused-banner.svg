<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#03050a" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5b942" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="purple-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 800; font-size: 54px; fill: #ffffff; letter-spacing: 2px; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .tag { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; fill: #00f0ff; }
    .orbit { fill: none; stroke-dasharray: 8 6; animation: rotate 30s linear infinite; transform-origin: 200px 200px; }
    .node-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; text-anchor: middle; }
    @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.4; } }
    .pulse-glow { animation: pulse 3s ease-in-out infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" rx="16" />

  <!-- Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.03)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Reactor Orbital Visual (Left Side) -->
  <g transform="translate(40, 0)">
    <!-- Outer Orbit -->
    <circle cx="200" cy="200" r="140" stroke="rgba(168, 85, 247, 0.25)" stroke-width="2" fill="none" />
    <circle cx="200" cy="200" r="110" stroke="#00f0ff" stroke-width="2" class="orbit" opacity="0.6" />
    <circle cx="200" cy="200" r="80" stroke="#f5b942" stroke-width="1.5" stroke-dasharray="4 8" fill="none" opacity="0.7" />
    
    <!-- Central Fusion Core -->
    <circle cx="200" cy="200" r="46" fill="#00f0ff" opacity="0.15" filter="url(#glow-filter)" class="pulse-glow" />
    <circle cx="200" cy="200" r="32" fill="#0c1929" stroke="#00f0ff" stroke-width="3" />
    <polygon points="200,182 216,210 184,210" fill="url(#cyan-glow)" />

    <!-- Tri-Pillar Satellites: Fabric, Purpur, Rust -->
    <!-- Node 1: Fabric (Top) -->
    <g transform="translate(200, 90)">
      <circle cx="0" cy="0" r="24" fill="#1e1b4b" stroke="#c084fc" stroke-width="2" />
      <text y="5" class="node-text" fill="#c084fc">FABRIC</text>
    </g>

    <!-- Node 2: Purpur / Bukkit (Bottom Right) -->
    <g transform="translate(295, 255)">
      <circle cx="0" cy="0" r="24" fill="#311333" stroke="#f472b6" stroke-width="2" />
      <text y="5" class="node-text" fill="#f472b6">PURPUR</text>
    </g>

    <!-- Node 3: Rust FFM (Bottom Left) -->
    <g transform="translate(105, 255)">
      <circle cx="0" cy="0" r="24" fill="#2d1b06" stroke="#f59e0b" stroke-width="2" />
      <text y="5" class="node-text" fill="#f59e0b">RUST</text>
    </g>

    <!-- Connector Lines -->
    <line x1="200" y1="114" x2="200" y2="168" stroke="rgba(192, 132, 252, 0.4)" stroke-width="2" />
    <line x1="275" y1="240" x2="228" y2="218" stroke="rgba(244, 114, 182, 0.4)" stroke-width="2" />
    <line x1="125" y1="240" x2="172" y2="218" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" />
  </g>

  <!-- Typography & Information (Right Side) -->
  <g transform="translate(440, 0)">
    <!-- Badge -->
    <rect x="0" y="70" width="260" height="28" rx="14" fill="rgba(0, 240, 255, 0.12)" stroke="rgba(0, 240, 255, 0.3)" />
    <text x="130" y="89" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" fill="#00f0ff" text-anchor="middle">
      SINGLE-INSTANCE FUSED ARCHITECTURE
    </text>

    <!-- Main Title -->
    <text x="0" y="150" class="title">DRAKESTAR <tspan fill="url(#cyan-glow)">FUSED</tspan></text>

    <!-- Subtitle -->
    <text x="0" y="190" class="subtitle">
      Fabric × Purpur × Slimefun-Rust Bridge Mod
    </text>

    <!-- Description -->
    <text x="0" y="235" font-family="'Inter', sans-serif" font-size="15" fill="#cbd5e1">
      Injects Bukkit API &amp; StarSuites directly into the Client's <tspan fill="#38bdf8" font-family="monospace">IntegratedServer</tspan>.
    </text>
    <text x="0" y="260" font-family="'Inter', sans-serif" font-size="15" fill="#94a3b8">
      Zero dual-JVM overhead · Zero RAM waste · Full Iris &amp; Sodium Shaders compatibility.
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 295)">
      <rect x="0" y="0" width="130" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="65" y="21" class="node-text" fill="#38bdf8">⚡ Fabric 1.21+</text>

      <rect x="142" y="0" width="145" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="214" y="21" class="node-text" fill="#f59e0b">🦀 Slimefun Rust</text>

      <rect x="299" y="0" width="155" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="376" y="21" class="node-text" fill="#c084fc">🏛 20,000+ Items</text>

      <rect x="466" y="0" width="135" height="32" rx="6" fill="rgba(255, 255, 255, 0.04)" stroke="rgba(255, 255, 255, 0.1)" />
      <text x="533" y="21" class="node-text" fill="#34d399">🌐 LAN &amp; Solitario</text>
    </g>
  </g>
</svg>
