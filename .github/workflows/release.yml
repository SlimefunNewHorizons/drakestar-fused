name: Release

# Publicar: subir mod_version en gradle.properties y empujar la etiqueta vX.Y.Z (igual a mod_version).
# El launcher DrakeStar descarga de la ultima release el jar `drakestar-fused-fabric-universal-*.jar`.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: La etiqueta coincide con mod_version
        run: |
          v=$(sed -n 's/^mod_version=//p' gradle.properties)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "La etiqueta ${GITHUB_REF_NAME} no coincide con mod_version=$v"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - run: gradle --no-daemon :fabric:build

      - run: python3 release-artifacts/check_jar.py fabric/build/libs/drakestar-fused-fabric-universal-*.jar

      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd fabric/build/libs
          rm -f *-sources.jar
          sha256sum drakestar-fused-fabric-universal-*.jar > SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" drakestar-fused-fabric-universal-*.jar SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --title "DrakeStar Fused ${GITHUB_REF_NAME}" \
            --prerelease \
            --notes "Fabric, Minecraft 1.20 a 26.2 (un solo jar, sin mixins). Alpha: prepara el entorno del servidor integrado; el host Bukkit todavia no ejecuta plugins."
