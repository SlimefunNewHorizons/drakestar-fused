name: DrakeStar Fused CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-fabric:
    name: Build Fabric (Minecraft 1.20 a 26.2, un solo jar)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar JSON del mod
        run: jq . fabric/src/main/resources/fabric.mod.json > /dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Compilar Fabric, NeoForge y Forge
        run: gradle --no-daemon :fabric:build :neoforge:build :forge:build

      - name: Los jars son universales (sin mixins ni nombres internos de Minecraft)
        run: |
          python3 release-artifacts/check_jar.py \
            fabric/build/libs/drakestar-fused-fabric-universal-*.jar \
            neoforge/build/libs/drakestar-fused-neoforge-universal-*.jar \
            forge/build/libs/drakestar-fused-forge-universal-*.jar

      - uses: actions/upload-artifact@v4
        with:
          name: drakestar-fused-universal-loaders
          path: |
            fabric/build/libs/drakestar-fused-fabric-universal-*.jar
            neoforge/build/libs/drakestar-fused-neoforge-universal-*.jar
            forge/build/libs/drakestar-fused-forge-universal-*.jar
          retention-days: 14
