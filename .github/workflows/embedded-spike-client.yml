name: Spike paso 2 (cliente Fabric 26.2 real)

# Corre el arnés del paso 2 en un runner de GitHub (Xvfb + llvmpipe) para no
# cargar Star. Solo produce evidencia; no publica nada.
on:
  push:
    branches: [ spike/embedded-isolation-20261117 ]
    paths:
      - 'tools/embedded-spike/**'
      - '.github/workflows/embedded-spike-client.yml'
  workflow_dispatch:

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      JAR_URL: https://github.com/SlimefunNewHorizons/DrakesPurpur/releases/download/26.2-drakes.141/purpur-paperclip-26.2.build.141-stable.jar
      JAR_SHA256: 30ff10f692c12df7a8260ed0f1ba1fa898968b7ee561d4ac087545a19a1e7ffe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Xvfb, mesa y ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb ffmpeg libgl1 libgl1-mesa-dri libegl1 libxcursor1 libxrandr2 libxi6 libxxf86vm1

      - name: Monolito DrakesPurpur b141 (con Slimefun 26.x + 9 suites embebidas)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/purpur.jar" "$JAR_URL"
          echo "$JAR_SHA256  $RUNNER_TEMP/purpur.jar" | sha256sum -c

      - name: Cliente Fabric 26.2
        run: python3 tools/embedded-spike/client/prepare_client.py --root "$RUNNER_TEMP/client"

      - name: Jugar (1er arranque directo con Slimefun + 9 suites desde el monolito b141)
        run: |
          python3 tools/embedded-spike/client/run_client.py --client-root "$RUNNER_TEMP/client" \
            --jar "$RUNNER_TEMP/purpur.jar" --java-home "$JAVA_HOME" --output "$RUNNER_TEMP/out" --timeout 1500
          python3 -c '
          import json, sys
          r = json.load(open("'"$RUNNER_TEMP"'/out/result.json"))
          assert r.get("pass") is True, f"pass!=True: {r}"
          assert "Slimefun" in r.get("plugins_enabled", []), f"Slimefun no habilitado en 1er arranque: {r}"
          assert "DrakesTech" in r.get("plugins_enabled", []), f"DrakesTech no habilitado en 1er arranque: {r}"
          assert r.get("unsatisfied_link") == 0, f"unsatisfied_link!=0: {r}"
          assert r.get("async_shutdown_nag") == 0, f"async_shutdown_nag!=0: {r}"
          '

      - name: Evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embedded-step2-client
          path: |
            ${{ runner.temp }}/out/*.json
            ${{ runner.temp }}/out/*.png
            ${{ runner.temp }}/out/*.txt
            ${{ runner.temp }}/out/server/logs/
            ${{ runner.temp }}/out/instance/logs/
          if-no-files-found: warn
