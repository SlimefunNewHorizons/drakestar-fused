// Un solo .jar para Minecraft 1.20 a 26.2. No usa Loom ni mixins: el mod solo toca Fabric Loader y los eventos de
// Fabric API (fabric-lifecycle-events-v1), que no dependen de los nombres internos de Minecraft. Por eso no hay que
// remapear nada y el mismo archivo sirve en versiones ofuscadas (intermediary) y en las no ofuscadas (26.x).
plugins {
    id 'java'
}

version = project.mod_version
group = project.maven_group
base.archivesName = 'drakestar-fused-fabric-universal'

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

sourceSets {
    // MinecraftServer vacio: solo para compilar (no se empaqueta; en ejecucion lo pone Minecraft).
    stubs {
        java.srcDir 'stubs'
    }
    main {
        java.srcDir '../common/src/main/java'   // el nucleo comun se empaqueta dentro del mismo .jar
    }
    // Host del servidor embebido (tools/embedded-spike, paquete por defecto): solo JDK, --release 25 porque usa
    // java.lang.classfile. Va en el mismo .jar; DrakeStarFusedClient lo invoca por reflexion solo en Java 25+.
    embedded {
        java {
            srcDirs = ['../tools/embedded-spike']
            include '*.java'
        }
    }
}


dependencies {
    // Compila contra stubs limpios de las firmas publicas de Fabric Loader 0.14.21 y Fabric API 0.83.0+1.20.
    compileOnly sourceSets.stubs.output
    compileOnly 'org.slf4j:slf4j-api:2.0.9'   // lo trae Minecraft en tiempo de ejecucion
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    // corre en Java 17 (1.20.x), 21 (1.21.x) y 25 (26.x); el host embebido solo en 25 (26.2)
    options.release = name == 'compileEmbeddedJava' ? 25 : 17
    options.compilerArgs += ['-Xlint:all', '-Xlint:-processing']
}

processResources {
    inputs.property 'version', project.version
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
    from('../assets') {
        include 'drakestar-fused-icon.png'
        into 'assets'
    }
}

jar {
    from sourceSets.embedded.output
    from('../LICENSE') {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
    manifest {
        attributes(
            'Implementation-Title': 'DrakeStar Fused',
            'Implementation-Version': project.version
        )
    }
}
